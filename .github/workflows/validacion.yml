name: Validacion Docker Build y Bake

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Comprobar configuracion con Docker Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          call: check

      - name: Comprobar configuracion con Docker Bake
        uses: docker/bake-action@v7
        with:
          source: .
          files: ./docker-bake.hcl
          targets: app
          call: check

      - name: Construir imagen con Docker Bake
        uses: docker/bake-action@v7
        with:
          source: .
          files: ./docker-bake.hcl
          targets: app
          load: true

      - name: Mostrar imagen creada
        run: docker image ls validacion-docker

      - name: Ejecutar programa y mostrar salida
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm validacion-docker:latest | tee salida.txt

      - name: Publicar salida en Summary
        shell: bash
        run: |
          {
            echo "## Resultado de la practica"
            echo ""
            echo "- Comprobacion con Docker Build: correcta."
            echo "- Comprobacion con Docker Bake: correcta."
            echo "- Construccion de imagen: correcta."
            echo "- Ejecucion del programa: correcta."
            echo ""
            echo "### Salida del programa"
            echo '```text'
            cat salida.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
